<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Spelling Star</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --primary: #ff8a3d;
    --primary-dark: #e76f1f;
    --accent: #4ec3ff;
    --accent-dark: #2196d6;
    --good: #4caf50;
    --good-dark: #357d3a;
    --warn: #ffb648;
    --bad: #ef5350;
    --text: #2b2b2b;
    --muted: #6e6e6e;
    --border: #e6dccb;
    --shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Comic Sans MS", "Chalkboard SE", "Segoe UI", system-ui, sans-serif;
    font-size: 18px;
    min-height: 100vh;
    overscroll-behavior: none;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px;
  }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 4px 12px;
  }
  .logo {
    font-weight: 800;
    font-size: 1.5rem;
    color: var(--primary-dark);
    letter-spacing: -0.5px;
  }
  .logo .star { color: var(--warn); }
  .top-actions { display: flex; gap: 8px; }
  .icon-btn {
    border: none;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    width: 44px;
    height: 44px;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .icon-btn:active { transform: translateY(2px); box-shadow: none; }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
    border: 2px solid var(--border);
    margin-bottom: 14px;
  }

  .word-pic {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #f0faff, #fff);
    border-radius: 18px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .word-pic svg {
    width: 180px;
    max-width: 60vw;
    height: 180px;
    max-height: 36vh;
  }

  .big-word {
    font-size: 2.4rem;
    text-align: center;
    font-weight: 800;
    letter-spacing: 4px;
    margin: 6px 0 10px;
    color: var(--primary-dark);
  }
  .blanked {
    font-size: 2.4rem;
    text-align: center;
    font-weight: 800;
    letter-spacing: 8px;
    margin: 6px 0 10px;
    color: var(--accent-dark);
    font-family: "Courier New", monospace;
  }
  .sentence {
    font-size: 1.1rem;
    text-align: center;
    color: var(--muted);
    margin: 4px 0 14px;
    line-height: 1.4;
  }
  .sentence em {
    font-style: normal;
    font-weight: 800;
    color: var(--primary-dark);
    background: #fff1d6;
    padding: 0 6px;
    border-radius: 6px;
  }
  .sentence .blank {
    display: inline-block;
    min-width: 4ch;
    border-bottom: 3px solid var(--accent);
    margin: 0 2px;
  }

  input.answer {
    width: 100%;
    font-size: 1.6rem;
    text-align: center;
    padding: 14px;
    border-radius: 16px;
    border: 3px solid var(--border);
    background: #fffdf6;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 2px;
    outline: none;
  }
  input.answer:focus { border-color: var(--accent); }
  input.answer.correct { border-color: var(--good); background: #ecfbe9; }
  input.answer.wrong { border-color: var(--bad); background: #ffeaea; }

  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }
  button.btn {
    border: none;
    border-radius: 16px;
    padding: 14px 18px;
    font-size: 1.05rem;
    font-weight: 800;
    color: white;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 4px 0 var(--primary-dark);
    min-height: 52px;
    min-width: 84px;
    font-family: inherit;
  }
  button.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
  button.btn.secondary { background: var(--accent); box-shadow: 0 4px 0 var(--accent-dark); }
  button.btn.good { background: var(--good); box-shadow: 0 4px 0 var(--good-dark); }
  button.btn.ghost {
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
  }
  button.btn:disabled { opacity: 0.5; box-shadow: none; }

  .feedback {
    text-align: center;
    font-size: 1.2rem;
    font-weight: 800;
    margin: 10px 0 0;
    min-height: 1.6rem;
  }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .mode-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .mode-btn {
    border: 2px solid var(--border);
    background: var(--card);
    border-radius: 14px;
    padding: 10px 4px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    font-family: inherit;
    line-height: 1.1;
  }
  .mode-btn .num {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .mode-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary-dark);
  }
  .mode-btn.active .num { color: rgba(255,255,255,0.9); }
  .mode-btn.locked { opacity: 0.55; }

  .progress-pips {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 4px 0 10px;
  }
  .pip {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #eee;
    border: 2px solid var(--border);
  }
  .pip.on { background: var(--warn); border-color: var(--primary-dark); }
  .pip.on.l4 { background: var(--good); border-color: var(--good-dark); }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    gap: 8px;
  }
  .word-counter {
    font-weight: 700;
    color: var(--muted);
  }

  .filter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .chip {
    border: 2px solid var(--border);
    background: var(--card);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
  }
  .chip.active { background: var(--accent); border-color: var(--accent-dark); color: white; }

  .dash-summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .stat {
    background: var(--card);
    border-radius: 14px;
    border: 2px solid var(--border);
    padding: 8px 4px;
    text-align: center;
  }
  .stat .n { font-size: 1.4rem; font-weight: 800; }
  .stat .l { font-size: 0.7rem; color: var(--muted); line-height: 1.1; }
  .stat.s0 .n { color: #999; }
  .stat.s1 .n { color: var(--accent-dark); }
  .stat.s2 .n { color: var(--warn); }
  .stat.s3 .n { color: var(--primary-dark); }
  .stat.s4 .n { color: var(--good); }

  .word-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }
  .word-tile {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    font-family: inherit;
    box-shadow: var(--shadow);
  }
  .word-tile:active { transform: translateY(2px); box-shadow: none; }
  .word-tile svg { width: 56px; height: 56px; display: block; margin: 0 auto; }
  .word-tile .name {
    font-weight: 800;
    margin-top: 4px;
    color: var(--text);
  }
  .word-tile .pips {
    display: flex; justify-content: center; gap: 3px; margin-top: 4px;
  }
  .word-tile .pip { width: 10px; height: 10px; border-width: 1.5px; }

  .scrambled {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 10px 0;
  }
  .letter-tile {
    background: var(--accent);
    color: white;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 1.4rem;
    font-weight: 800;
    border: none;
    box-shadow: 0 3px 0 var(--accent-dark);
    font-family: inherit;
    min-width: 44px;
    cursor: pointer;
  }
  .letter-tile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }
  .letter-tile.used { opacity: 0.3; pointer-events: none; }

  .session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    padding: 10px 14px;
    background: #fff1d6;
    border-radius: 14px;
    border: 2px solid #f3d8a3;
  }
  .session-bar .label { font-weight: 800; color: var(--primary-dark); }

  .hidden { display: none !important; }

  .part-heading {
    margin: 18px 4px 8px;
    font-size: 1rem;
    color: var(--primary-dark);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .paragraph-card {
    border-radius: 18px;
    background: linear-gradient(180deg, #fff5e3, #fff);
  }
  .paragraph-card:active { transform: translateY(2px); }
  .paragraph-text {
    font-size: 1.1rem;
    line-height: 1.7;
    text-align: left;
    margin: 8px 0 14px;
  }
  .sentence-btn {
    display: inline;
    border: none;
    background: #fff1d6;
    color: var(--text);
    border-radius: 8px;
    padding: 4px 8px;
    margin: 2px;
    font-size: 1.05rem;
    font-family: inherit;
    cursor: pointer;
    line-height: 1.5;
  }
  .sentence-btn:active { background: var(--warn); color: #fff; }
  .paragraph-answer {
    font-size: 1.1rem;
    text-align: left;
    letter-spacing: normal;
    line-height: 1.4;
    resize: vertical;
    min-height: 80px;
  }

  @media (max-width: 380px) {
    .word-list { grid-template-columns: repeat(2, 1fr); }
    .dash-summary { grid-template-columns: repeat(5, 1fr); }
    .stat .n { font-size: 1.1rem; }
    .big-word, .blanked { font-size: 2rem; letter-spacing: 3px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo">Spelling <span class="star">★</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="btnHome" title="Home" aria-label="Home">🏠</button>
      <button class="icon-btn" id="btnDaily" title="Daily 10" aria-label="Daily Practice">⚡</button>
    </div>
  </header>

  <main id="main"></main>
</div>

  if (!state.progress[word]) {
    state.progress[word] = { l1: 0, l2: 0, l3: 0, l4: 0, wrong: 0, right: 0, lastSeen: 0 };

  return state.progress[word];
}

  speechSynthesis.onvoiceschanged = loadVoices;

}
function speak(text) {
  if (!("speechSynthesis" in window)) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1.05;
    u.lang = "en-GB";
    const voices = speechSynthesis.getVoices();
    const pref = voices.find(v => /en[-_]GB/i.test(v.lang)) ||
                 voices.find(v => /en/i.test(v.lang));
    if (pref) u.voice = pref;
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}

function normalize(s) { return (s || "").trim().toLowerCase().replace(/\s+/g, " "); }

function blankWord(word) {
  const vowels = "aeiou";
  const chars = word.split("");
  const positions = [];
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i].toLowerCase();
    if (vowels.includes(ch)) positions.push(i);
  }
  // Decide how many vowels to blank
  let toBlank;
  if (positions.length <= 1) toBlank = Math.min(1, positions.length);
  else if (positions.length === 2) toBlank = 1;
  else toBlank = Math.ceil(positions.length / 2);

  // Prefer blanking interior vowels (skip first vowel when possible)
  let pool = positions.slice();
  if (pool.length > toBlank && pool[0] === 0) pool = pool.slice(1);
  const blanks = pool.slice(0, toBlank);

  // For longer single words, also blank one consonant in the middle
  if (word.length >= 7 && !word.includes(" ")) {
    const mid = Math.floor(word.length / 2);
    for (let off = 0; off < 4; off++) {
      const idx = mid + off;
      const ch = chars[idx] && chars[idx].toLowerCase();
      if (idx > 0 && idx < word.length - 1 && !blanks.includes(idx)
          && ch && !vowels.includes(ch) && /[a-z]/.test(ch)) {
        blanks.push(idx);
        break;
      }
    }
  }

  for (const pos of blanks) chars[pos] = "_";
  return chars.join("");
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Filtering & weighted pick ---------- */
function filteredWords() {
  if (state.filter === "practice") {
    return WORDS.filter(w => {
      const p = getP(w.word);
      const lv = levelOf(p);
      return lv < 4 && (p.wrong > 0 || lv > 0);
    });
  }
  if (state.filter === "mastered") {
    return WORDS.filter(w => levelOf(getP(w.word)) === 4);
  }
  if (state.filter && state.filter.startsWith("part:")) {
    const p = state.filter.slice(5);
    return WORDS.filter(w => w.part === p);
  }
  return WORDS.slice();
}

function weightFor(word) {
  const p = getP(word);
  const lv = levelOf(p);
  // Mastered words much less likely. Wrong answers boost weight.
  let w = 1;
  if (lv === 0) w = 3;
  else if (lv === 1) w = 4;
  else if (lv === 2) w = 3;
  else if (lv === 3) w = 2;
  else w = 0.4;
  w += (p.wrong || 0) * 2;
  w -= (p.right || 0) * 0.1;
  return Math.max(0.2, w);
}

function buildDailySession(n = 10) {
  const pool = WORDS.slice();
  const picks = [];
  const used = new Set();
  while (picks.length < n && picks.length < pool.length) {
    const remaining = pool.filter(w => !used.has(w.word));
    if (!remaining.length) break;
    const totalW = remaining.reduce((s, w) => s + weightFor(w.word), 0);
    let r = Math.random() * totalW;
    let chosen = remaining[remaining.length - 1];
    for (const w of remaining) {
      r -= weightFor(w.word);
      if (r <= 0) { chosen = w; break; }
    }
    picks.push(chosen.word);
    used.add(chosen.word);
  }
  return picks;
}

/* ---------- Routing ---------- */
function goDashboard() {
  state.view = "dashboard";
  state.session = null;
  render();
}
function startDaily() {
  const list = buildDailySession(10);
  if (!list.length) return;
  state.session = { type: "daily", list, pos: 0 };
  state.view = "word";
  state.currentList = list;
  state.index = 0;
  state.mode = pickStartingMode(list[0]);
  render();
}
function openWord(word, mode) {
  const list = filteredWords().map(w => w.word);
  state.currentList = list.length ? list : WORDS.map(w => w.word);
  const idx = state.currentList.indexOf(word);
  state.index = idx >= 0 ? idx : 0;
  if (idx < 0) state.currentList.unshift(word), state.index = 0;
  state.session = null;
  state.view = "word";
  state.mode = mode || pickStartingMode(word);
  render();
}

function pickStartingMode(word) {
  const p = getP(word);
  if (!p.l1) return "learn";
  if (!p.l2) return "copy";
  if (!p.l3) return "guided";
  return "dictation";
}

function nextCard() {
  if (state.session) {
    state.session.pos++;
    if (state.session.pos >= state.session.list.length) {
      state.session = null;
      state.view = "dashboard";
      render();
      return;
    }
    state.index = state.session.pos;
    state.currentList = state.session.list;
    state.mode = pickStartingMode(state.currentList[state.index]);
  } else {
    state.index = (state.index + 1) % state.currentList.length;
    state.mode = pickStartingMode(state.currentList[state.index]);
  }
  render();
}

function prevCard() {
  if (state.session) return;
  state.index = (state.index - 1 + state.currentList.length) % state.currentList.length;
  state.mode = pickStartingMode(state.currentList[state.index]);
  render();
}

/* ---------- Rendering ---------- */
const main = document.getElementById("main");

function render() {
  if (state.view === "dashboard") renderDashboard();
  else if (state.view === "paragraph") renderParagraph();
  else renderWord();
}

function renderDashboard() {
  const counts = [0,0,0,0,0];
  for (const w of WORDS) counts[levelOf(getP(w.word))]++;

  const list = filteredWords();
  const parts = ["A", "B", "C"];
  const grouped = parts.map(p => ({
    part: p,
    label: PART_LABELS[p],
    items: list.filter(w => w.part === p),
  })).filter(g => g.items.length > 0);

  const partFilterChip = (p) => `
    <button class="chip ${state.filter==='part:'+p?'active':''}" data-f="part:${p}">Part ${p}</button>
  `;

  main.innerHTML = `
    <div class="filter-bar">
      <button class="chip ${state.filter==='all'?'active':''}" data-f="all">All (${WORDS.length})</button>
      ${parts.map(partFilterChip).join("")}
      <button class="chip ${state.filter==='practice'?'active':''}" data-f="practice">Need Practice</button>
      <button class="chip ${state.filter==='mastered'?'active':''}" data-f="mastered">Mastered</button>
    </div>

    <div class="dash-summary">
      <div class="stat s0"><div class="n">${counts[0]}</div><div class="l">Not started</div></div>
      <div class="stat s1"><div class="n">${counts[1]}</div><div class="l">Learning</div></div>
      <div class="stat s2"><div class="n">${counts[2]}</div><div class="l">Practising</div></div>
      <div class="stat s3"><div class="n">${counts[3]}</div><div class="l">Dictation</div></div>
      <div class="stat s4"><div class="n">${counts[4]}</div><div class="l">Mastered</div></div>
    </div>

    <div class="card" style="text-align:center;">
      <div style="font-weight:800;font-size:1.1rem;margin-bottom:6px;">⚡ Daily Quick Practice</div>
      <div style="color:var(--muted);margin-bottom:10px;">10 cards picked just for you</div>
      <button class="btn good" id="dailyStart">Start Daily 10</button>
    </div>

    <button class="card paragraph-card" id="paragraphCard" style="text-align:left;display:flex;gap:14px;align-items:center;width:100%;border:2px solid var(--border);cursor:pointer;font-family:inherit;">
      <div style="flex:0 0 64px;">${SVG.paragraph}</div>
      <div style="flex:1;">
        <div style="font-weight:800;font-size:1.05rem;">📖 Part B Paragraph</div>
        <div style="color:var(--muted);font-size:0.85rem;margin-top:2px;">Hear it, then write each sentence</div>
      </div>
      <div style="font-size:1.4rem;color:var(--primary-dark);">▶</div>
    </button>

    ${grouped.length === 0
      ? `<div class="card" style="text-align:center;color:var(--muted);">No words match this filter yet.</div>`
      : grouped.map(g => `
          <h3 class="part-heading">${g.label}</h3>
          <div class="word-list">
            ${g.items.map(w => wordTileHTML(w.word)).join("")}
          </div>
        `).join("")}
  `;

  document.querySelectorAll(".chip[data-f]").forEach(b => {
    b.addEventListener("click", () => {
      state.filter = b.dataset.f;
      render();
    });
  });
  const ds = document.getElementById("dailyStart");
  if (ds) ds.addEventListener("click", startDaily);
  const pc = document.getElementById("paragraphCard");
  if (pc) pc.addEventListener("click", openParagraph);
  document.querySelectorAll(".word-tile").forEach(t => {
    t.addEventListener("click", () => openWord(t.dataset.word));
  });
}

function wordTileHTML(word) {
  const def = findWord(word);
  const p = getP(word);
  const lv = levelOf(p);
  return `
    <button class="word-tile" data-word="${word}">
      ${SVG[def.icon] || ""}
      <div class="name">${def.word}</div>
      <div class="pips">
        <span class="pip ${p.l1?"on":""}"></span>
        <span class="pip ${p.l2?"on":""}"></span>
        <span class="pip ${p.l3?"on":""}"></span>
        <span class="pip ${p.l4?"on l4":""}"></span>
      </div>
      <div style="font-size:0.7rem;color:var(--muted);margin-top:2px;">${LEVEL_LABEL[lv]}</div>
    </button>
  `;
}

function renderWord() {
  const word = state.currentList[state.index];
  if (!word) { goDashboard(); return; }
  const def = findWord(word);
  const p = getP(word);
  const lv = levelOf(p);

  // Mode locking: must do learn before copy, etc — but allow free re-access.
  const locked = {
    learn: false,
    copy: !p.l1,
    guided: !p.l2,
    dictation: !p.l3,
  };
  if (locked[state.mode]) state.mode = pickStartingMode(word);

  const sessionBar = state.session
    ? `<div class="session-bar">
         <div class="label">⚡ Daily ${state.session.pos + 1}/${state.session.list.length}</div>
         <button class="chip" id="sessionExit">Stop</button>
       </div>` : "";

  main.innerHTML = `
    ${sessionBar}
    <div class="mode-bar">
      ${MODES.map((m, i) => `
        <button class="mode-btn ${state.mode===m?"active":""} ${locked[m]?"locked":""}" data-mode="${m}">
          <span class="num">Step ${i+1}</span>
          ${MODE_LABELS[m]}
        </button>
      `).join("")}
    </div>

    <div class="card" id="cardArea"></div>

    <div class="nav-row">
      ${state.session ? "" : `<button class="btn ghost" id="prevBtn">◀ Back</button>`}
      <div class="word-counter">${state.session ? "" : `Word ${state.index+1} / ${state.currentList.length}`}</div>
      <button class="btn" id="nextBtn">${state.session ? "Skip ▶" : "Next ▶"}</button>
    </div>
  `;

  document.querySelectorAll(".mode-btn").forEach(b => {
    b.addEventListener("click", () => {
      const m = b.dataset.mode;
      if (locked[m]) {
        flashMessage("Try the earlier steps first!");
        return;
      }
      state.mode = m;
      renderWord();
    });
  });
  const sx = document.getElementById("sessionExit");
  if (sx) sx.addEventListener("click", () => { state.session = null; goDashboard(); });
  const pb = document.getElementById("prevBtn");
  if (pb) pb.addEventListener("click", prevCard);
  document.getElementById("nextBtn").addEventListener("click", nextCard);

  switch (state.mode) {
    case "learn":     renderLearn(def, p); break;
    case "copy":      renderCopy(def, p); break;
    case "guided":    renderGuided(def, p); break;
    case "dictation": renderDictation(def, p); break;
  }
}

function renderLearn(def, p) {
  const area = document.getElementById("cardArea");
  area.innerHTML = `
    <div class="word-pic">${SVG[def.icon] || ""}</div>
    <div class="big-word">${def.word}</div>
    <div class="sentence">${sentenceWithWord(def.sentence, def.word)}</div>
    <div class="row">
      <button class="btn secondary" id="speakBtn">🔊 Hear it</button>
      <button class="btn" id="speakSentence">🗣️ Read sentence</button>
      <button class="btn good" id="learnedBtn">I know it! ✓</button>
    </div>
    <div class="feedback" id="fb"></div>
  `;
  document.getElementById("speakBtn").addEventListener("click", () => {
    if (!speak(def.word)) flashMessage("Speech not available on this device.");
  });
  document.getElementById("speakSentence").addEventListener("click", () => {
    speak(def.sentence.replace(/_+/g, def.word));
  });
  document.getElementById("learnedBtn").addEventListener("click", () => {
    p.l1 = 1;
    p.lastSeen = Date.now();
    saveProgress();
    fb("Great! Now try copying it ✏️", "good");
    setTimeout(() => { state.mode = "copy"; renderWord(); }, 700);
  });
  // Auto-mark seen
  p.l1 = Math.max(p.l1, 1);
  p.lastSeen = Date.now();
  saveProgress();
}

function sentenceWithWord(sentence, word) {
  return sentence.replace(/_+/g, `<em>${word}</em>`);
}

function renderCopy(def, p) {
  const area = document.getElementById("cardArea");
  area.innerHTML = `
    <div class="word-pic">${SVG[def.icon] || ""}</div>
    <div class="big-word">${def.word}</div>
    <div class="sentence">Type the word below.</div>
    <input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" />
    <div class="row">
      <button class="btn secondary" id="speakBtn">🔊 Hear it</button>
      <button class="btn good" id="checkBtn">Check ✓</button>
    </div>
    <div class="feedback" id="fb"></div>
  `;
  const input = document.getElementById("ans");
  input.focus();
  input.addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
  document.getElementById("checkBtn").addEventListener("click", doCheck);
  document.getElementById("speakBtn").addEventListener("click", () => speak(def.word));

  function doCheck() {
    const ans = normalize(input.value);
    if (!ans) { fb("Type the word first!", "bad"); return; }
    if (ans === def.word.toLowerCase()) {
      input.classList.add("correct");
      p.l2 = 1; p.right++; saveProgress();
      fb("Yes! Perfect spelling 🌟", "good");
      setTimeout(() => { state.mode = "guided"; renderWord(); }, 900);
    } else {
      input.classList.add("wrong");
      p.wrong++; saveProgress();
      fb(`Almost! It's "${def.word}". Try again 🙂`, "bad");
      setTimeout(() => { input.classList.remove("wrong"); input.value = ""; input.focus(); }, 900);
    }
  }
}

function renderGuided(def, p) {
  const area = document.getElementById("cardArea");
  const blanks = blankWord(def.word);
  const scrambled = shuffle(def.word.split(""));
  area.innerHTML = `
    <div class="word-pic">${SVG[def.icon] || ""}</div>
    <div class="blanked">${blanks.split("").map(c => c === "_" ? "_" : c).join(" ")}</div>
    <div class="sentence">Fill in the missing letters.</div>
    <input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" />
    <div class="row">
      <button class="btn secondary" id="speakBtn">🔊 Hear it</button>
      <button class="btn ghost" id="hintBtn">🔤 Letter hint</button>
      <button class="btn good" id="checkBtn">Check ✓</button>
    </div>
    <div class="scrambled hidden" id="scrambleBox">
      ${scrambled.map((c, i) => `<button class="letter-tile" data-i="${i}" data-c="${c}">${c}</button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
  `;
  const input = document.getElementById("ans");
  input.focus();
  input.addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
  document.getElementById("checkBtn").addEventListener("click", doCheck);
  document.getElementById("speakBtn").addEventListener("click", () => speak(def.word));

  const hintBtn = document.getElementById("hintBtn");
  const scrambleBox = document.getElementById("scrambleBox");
  hintBtn.addEventListener("click", () => scrambleBox.classList.toggle("hidden"));

  scrambleBox.querySelectorAll(".letter-tile").forEach(btn => {
    btn.addEventListener("click", () => {
      input.value += btn.dataset.c;
      btn.classList.add("used");
      input.focus();
    });
  });

  function doCheck() {
    const ans = normalize(input.value);
    if (!ans) { fb("Type the full word!", "bad"); return; }
    if (ans === def.word.toLowerCase()) {
      input.classList.add("correct");
      p.l3 = 1; p.right++; saveProgress();
      fb("Excellent spelling! 🎉", "good");
      setTimeout(() => { state.mode = "dictation"; renderWord(); }, 900);
    } else {
      input.classList.add("wrong");
      p.wrong++; saveProgress();
      fb(`Not quite. It's "${def.word}". Try again!`, "bad");
      setTimeout(() => {
        input.classList.remove("wrong"); input.value = "";
        scrambleBox.querySelectorAll(".letter-tile.used").forEach(b => b.classList.remove("used"));
        input.focus();
      }, 1100);
    }
  }
}

function renderDictation(def, p) {
  const area = document.getElementById("cardArea");
  const sentenceHtml = def.sentence.replace(/_+/g, `<span class="blank">&nbsp;</span>`);
  area.innerHTML = `
    <div class="word-pic">${SVG[def.icon] || ""}</div>
    <div class="sentence">${sentenceHtml}</div>
    <div class="sentence" style="font-size:1rem;">Listen, then write the missing word.</div>
    <input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" />
    <div class="row">
      <button class="btn secondary" id="speakBtn">🔊 Say the word</button>
      <button class="btn secondary" id="speakSentence">🗣️ Whole sentence</button>
      <button class="btn good" id="checkBtn">Check ✓</button>
    </div>
    <div class="feedback" id="fb"></div>
  `;
  const input = document.getElementById("ans");
  input.focus();
  input.addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
  document.getElementById("checkBtn").addEventListener("click", doCheck);
  document.getElementById("speakBtn").addEventListener("click", () => speak(def.word));
  document.getElementById("speakSentence").addEventListener("click", () => speak(def.sentence.replace(/_+/g, def.word)));
  // Auto-speak once on entering dictation mode
  setTimeout(() => speak(def.word), 250);

  function doCheck() {
    const ans = normalize(input.value);
    if (!ans) { fb("Listen, then type the word!", "bad"); return; }
    if (ans === def.word.toLowerCase()) {
      input.classList.add("correct");
      p.l4 = 1; p.right++; saveProgress();
      fb("⭐ Mastered! Amazing work!", "good");
      setTimeout(nextCard, 1100);
    } else {
      input.classList.add("wrong");
      p.wrong++;
      // Drop dictation level — they need more practice
      saveProgress();
      fb(`Listen again. The word was "${def.word}".`, "bad");
      setTimeout(() => {
        input.classList.remove("wrong"); input.value = "";
        speak(def.word);
        input.focus();
      }, 1300);
    }
  }
}

/* ---------- Paragraph practice ---------- */
function openParagraph() {
  state.view = "paragraph";
  state.paragraph = { mode: "read", index: 0 };
  render();
}

function renderParagraph() {
  const pg = state.paragraph || (state.paragraph = { mode: "read", index: 0 });
  const sentences = PARAGRAPH.sentences;
  const fullText = sentences.join(" ");

  if (pg.mode === "read") {
    main.innerHTML = `
      <div class="session-bar">
        <div class="label">📖 ${PARAGRAPH.title}</div>
        <button class="chip" id="paraExit">Home</button>
      </div>
      <div class="card">
        <div class="word-pic">${SVG.paragraph}</div>
        <div class="paragraph-text">
          ${sentences.map((s, i) => `<button class="sentence-btn" data-i="${i}">${s}</button>`).join(" ")}
        </div>
        <div class="row">
          <button class="btn secondary" id="hearAll">🔊 Hear paragraph</button>
          <button class="btn good" id="startType">Type each sentence ✏️</button>
        </div>
        <div class="feedback" id="fb">Tap any sentence to hear it.</div>
      </div>
    `;
    document.getElementById("paraExit").addEventListener("click", goDashboard);
    document.getElementById("hearAll").addEventListener("click", () => speak(fullText));
    document.getElementById("startType").addEventListener("click", () => {
      pg.mode = "type";
      pg.index = 0;
      render();
    });
    document.querySelectorAll(".sentence-btn").forEach(b => {
      b.addEventListener("click", () => speak(sentences[+b.dataset.i]));
    });
    return;
  }

  // type mode: dictate one sentence at a time
  const i = pg.index;
  const target = sentences[i];

  main.innerHTML = `
    <div class="session-bar">
      <div class="label">✏️ Sentence ${i + 1} / ${sentences.length}</div>
      <button class="chip" id="paraExit">Home</button>
    </div>
    <div class="card">
      <div class="word-pic">${SVG.paragraph}</div>
      <div class="sentence" style="font-size:1rem;">Listen, then write the sentence.</div>
      <textarea class="answer paragraph-answer" id="ans" rows="3" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn secondary" id="speakBtn">🔊 Hear it again</button>
        <button class="btn ghost" id="showBtn">👁 Show me</button>
        <button class="btn good" id="checkBtn">Check ✓</button>
      </div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="nav-row">
      <button class="btn ghost" id="prevSent" ${i === 0 ? "disabled" : ""}>◀ Back</button>
      <div class="word-counter">Sentence ${i + 1} of ${sentences.length}</div>
      <button class="btn" id="nextSent">${i === sentences.length - 1 ? "Finish" : "Skip ▶"}</button>
    </div>
  `;

  const input = document.getElementById("ans");
  input.focus();
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doCheck(); }
  });
  document.getElementById("speakBtn").addEventListener("click", () => speak(target));
  document.getElementById("checkBtn").addEventListener("click", doCheck);
  document.getElementById("paraExit").addEventListener("click", goDashboard);
  document.getElementById("showBtn").addEventListener("click", () => {
    fb(target, "good");
    speak(target);
  });
  document.getElementById("prevSent").addEventListener("click", () => {
    if (pg.index > 0) { pg.index--; render(); }
  });
  document.getElementById("nextSent").addEventListener("click", () => {
    if (pg.index < sentences.length - 1) { pg.index++; render(); }
    else { pg.mode = "read"; render(); }
  });
  setTimeout(() => speak(target), 250);

  function doCheck() {
    const ans = normalizeSentence(input.value);
    const want = normalizeSentence(target);
    if (!ans) { fb("Listen, then write the sentence.", "bad"); return; }
    if (ans === want) {
      input.classList.add("correct");
      fb("⭐ Perfect! On to the next.", "good");
      setTimeout(() => {
        if (pg.index < sentences.length - 1) { pg.index++; render(); }
        else { pg.mode = "read"; fb("All sentences done! 🎉", "good"); render(); }
      }, 900);
    } else {
      input.classList.add("wrong");
      fb(`Almost! It's: "${target}"`, "bad");
      setTimeout(() => { input.classList.remove("wrong"); speak(target); input.focus(); }, 1400);
    }
  }
}

function normalizeSentence(s) {
  return (s || "")
    .trim()
    .toLowerCase()
    .replace(/[.,!?;:"]/g, "")
    .replace(/\s+/g, " ");
}

/* ---------- Tiny helpers ---------- */
function fb(text, type) {
  const el = document.getElementById("fb");
  if (!el) return;
  el.textContent = text;
  el.className = "feedback " + (type || "");
}
function flashMessage(msg) {
  const el = document.getElementById("fb");
  if (el) { fb(msg, "bad"); return; }
  alert(msg);
}

/* ---------- Init ---------- */
document.getElementById("btnHome").addEventListener("click", goDashboard);
document.getElementById("btnDaily").addEventListener("click", startDaily);

state.progress = loadProgress();
goDashboard();
</script>
