name: Generate Part B Dictation Audio

on:
  push:
    paths:
      - ".github/workflows/generate-partb-audio.yml"
      - "dictapet/audio-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install neural TTS
        run: python -m pip install --disable-pip-version-check edge-tts

      - name: Generate fixed British-English dictation files
        shell: bash
        run: |
          mkdir -p dictapet/audio/partb
          python3 <<'PY'
          import asyncio
          from pathlib import Path
          import edge_tts

          scripts = [
              "It's Joe's first day at his new school, full stop.",
              "It's ten o'clock and the pupils are in the music room, full stop.",
              "They're playing the recorder, full stop.",
              "Joe thinks it is difficult to repeat after the teacher, full stop.",
              "Open quotation mark, Oh, comma, no, exclamation mark, close quotation mark, says Joe, full stop.",
              "Open quotation mark, I'm in the wrong class, full stop, close quotation mark.",
              "Joe and the other pupils laugh, full stop.",
              "Joe goes to his classroom, full stop.",
          ]

          VOICE = "en-GB-SoniaNeural"
          OUT = Path("dictapet/audio/partb")

          async def one(idx, script, mode, rate):
              full = f"Sentence {idx}. {script} Again. {script}"
              path = OUT / f"{idx:02d}-{mode}.mp3"
              communicate = edge_tts.Communicate(full, VOICE, rate=rate)
              await communicate.save(str(path))

          async def main():
              jobs = []
              for idx, script in enumerate(scripts, 1):
                  jobs.append(one(idx, script, "normal", "-8%"))
                  jobs.append(one(idx, script, "slow", "-24%"))
              await asyncio.gather(*jobs)
              (OUT / "voice.txt").write_text(VOICE + "\n", encoding="utf-8")
              (OUT / "script.txt").write_text("\n".join(f"{i+1}. {s}" for i, s in enumerate(scripts)) + "\n", encoding="utf-8")

          asyncio.run(main())
          PY

      - name: Commit generated audio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictapet/audio/partb
          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "Add prebuilt Part B neural dictation audio"
            git push
          fi
